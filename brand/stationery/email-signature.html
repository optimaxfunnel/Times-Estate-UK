<!--
  Times Estate Ltd — email signature (Direction E, Claret)

  Email clients (especially Outlook desktop) do not reliably load
  external web fonts or modern CSS, so this uses a table layout, inline
  styles only, and web-safe font fallbacks (Georgia for the display
  name, Arial/Helvetica for everything else) rather than Playfair
  Display/Work Sans — this is standard, deliberate practice for email,
  not an inconsistency with the rest of the identity.

  BEFORE USE: replace [Name] / [Job Title] / [email] with the real
  values, and replace the monogram <img src> with a real, publicly
  hosted URL (email cannot reference a local file) — e.g. once a real
  domain/hosting exists, https://timesestates.co.uk/brand/te-monogram-96.png
-->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; color: #201014;">
  <tr>
    <td style="padding-right: 16px; vertical-align: top;">
      <img src="[HOSTED-URL]/te-monogram-96.png" width="48" height="48" alt="Times Estate" style="display: block; border-radius: 9px;">
    </td>
    <td style="border-left: 3px solid #7A1F3D; padding-left: 16px; vertical-align: top;">
      <div style="font-family: Georgia, 'Times New Roman', serif; font-weight: bold; font-size: 16px; color: #201014;">[Name]</div>
      <div style="font-size: 12px; color: #7A1F3D; margin-top: 2px;">[Job Title] &middot; Times Estate Ltd</div>
      <div style="font-size: 12px; color: #201014; margin-top: 8px; line-height: 1.6;">
        020 8672 8080 &nbsp;&middot;&nbsp; +44 7779 991313<br>
        [email]@timesestates.co.uk &nbsp;&middot;&nbsp; <a href="https://timesestates.co.uk" style="color:#7A1F3D; text-decoration:none;">timesestates.co.uk</a>
      </div>
      <div style="font-size: 10px; color: #201014; opacity: 0.6; margin-top: 8px;">
        Times Estate Ltd &middot; Company No. 09597081 &middot; 145 Upper Tooting Road, London, SW17 7TJ
      </div>
    </td>
  </tr>
</table>
