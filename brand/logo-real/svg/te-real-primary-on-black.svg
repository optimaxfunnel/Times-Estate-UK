<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140"><style>@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&amp;display=swap');</style><rect width="100%" height="100%" fill="#141414"/>
     <g transform="translate(20,28)">
    <!-- T stem -->
    <rect x="18" y="18" width="14" height="64" fill="#FFFFFF"/>
    <!-- T crossbar, rounded, orange -->
    <rect x="0" y="6" width="50" height="16" rx="8" fill="#D9772E"/>
    <!-- i stem -->
    <rect x="60" y="34" width="13" height="48" fill="#FFFFFF"/>
    <!-- i dot, oversized, orange -->
    <circle cx="66.5" cy="14" r="11" fill="#D9772E"/>
  </g>
     <text x="108" y="104" font-family="'Baloo 2', 'Comic Sans MS', sans-serif" font-weight="700" font-size="68" fill="#FFFFFF">mes</text>
     <g transform="translate(300,20)">
    <!-- chimney -->
    <rect x="66" y="10" width="12" height="18" fill="#D9772E"/>
    <!-- pitched roof -->
    <polygon points="50,4 4,46 96,46" fill="#D9772E"/>
    <!-- house body -->
    <rect x="10" y="44" width="80" height="48" rx="4" fill="#D9772E"/>
    <!-- letter E, built from plain rectangles (font-free) -->
    <rect x="38" y="53" width="9" height="30" fill="#FFFFFF"/>
    <rect x="38" y="53" width="26" height="9" fill="#FFFFFF"/>
    <rect x="38" y="64" width="20" height="8.5" fill="#FFFFFF"/>
    <rect x="38" y="74" width="26" height="9" fill="#FFFFFF"/>
  </g>
     <text x="404" y="104" font-family="'Baloo 2', 'Comic Sans MS', sans-serif" font-weight="700" font-size="68" fill="#FFFFFF">states</text></svg>
